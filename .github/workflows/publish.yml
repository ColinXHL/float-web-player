name: AkashaNavigator Publish
run-name: "AkashaNavigator ${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "AkashaNavigator Version (e.g., 0.1.0, 0.1.1-alpha.1)"
        required: true
        type: string
      channel:
        description: "发布通道"
        type: choice
        required: true
        default: "release"
        options:
          - release
          - dev
      create_release:
        description: "是否创建 GitHub Release 草稿"
        required: true
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Set version from input or tag
        id: set-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            # 更简单安全的正则，兼容 0.2.0、0.2.0-alpha 等
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "❌ 错误：版本格式必须符合语义化版本规范 (例如: 1.2.3, 1.2.3-alpha, 1.2.3+build.123)"
              exit 1
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "✨ 手动触发构建，版本号：$VERSION"
          else
            # Extract version from tag name (remove 'v' prefix)
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "🏷️ 从 tag 触发构建，版本号：$VERSION"
          fi

      - name: Verify version matches csproj
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' AkashaNavigator/AkashaNavigator.csproj)
          echo "📋 输入版本号: $VERSION"
          echo "📋 csproj 版本号: $CSPROJ_VERSION"
          if [[ "$VERSION" != "$CSPROJ_VERSION" ]]; then
            echo "❌ 错误：输入的版本号 ($VERSION) 与 csproj 中的版本号 ($CSPROJ_VERSION) 不匹配！"
            echo "请先更新 AkashaNavigator/AkashaNavigator.csproj 中的 <Version> 标签。"
            exit 1
          fi
          echo "✅ 版本号匹配"

      - name: Verify release notes match version
        if: github.event.inputs.create_release == 'true'
        run: |
          VERSION="${{ steps.set-version.outputs.version }}"
          if [[ ! -s release_badges.md ]]; then
            echo "❌ 错误：release_badges.md 不存在或内容为空"
            exit 1
          fi
          if ! grep -Fq "## v${VERSION}" release_badges.md; then
            echo "❌ 错误：release_badges.md 与发布版本 v${VERSION} 不匹配"
            exit 1
          fi
          echo "✅ Release Notes 版本匹配"

  build_dist:
    runs-on: windows-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: 🛠️ Publish AkashaNavigator
        run: |
          dotnet publish AkashaNavigator/AkashaNavigator.csproj `
            -c Release `
            -p:PublishProfile=FolderProfile `
            /p:Version=${{ needs.validate.outputs.version }}

      - name: 🧹 Collect publish files
        run: |
          $sourceDir = ".\AkashaNavigator\bin\Release\net8.0-windows\win-x64\publish"
          # 清理 dist/AkashaNavigator 目录，避免权限问题
          if (Test-Path ".\dist\AkashaNavigator") {
              Remove-Item -Recurse -Force ".\dist\AkashaNavigator"
          }
          New-Item -ItemType Directory -Path ".\dist\AkashaNavigator"
          Copy-Item "$sourceDir\*" ".\dist\AkashaNavigator" -Recurse -Force
          # 可选：删除无用文件
          Get-ChildItem ".\dist\AkashaNavigator" -Recurse -Include *.pdb,*.lib | Remove-Item -Force

      - name: 📥 Download kachina-builder
        # 先生成本地 updater，确保便携包内自带 AkashaNavigator.update.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download `
            --repo YuehaiTeam/kachina-installer `
            --pattern "kachina-builder.exe" `
            --dir .

      - name: ⚙️ Generate updater executable
        # 生成 dist/AkashaNavigator/AkashaNavigator.update.exe，然后再打 7z
        shell: pwsh
        run: |
          .\kachina-builder.exe pack `
            -c .\Build\kachina.config.json `
            -o .\dist\AkashaNavigator\AkashaNavigator.update.exe `
            --icon .\assets\icons\akasha-navigator.ico `
            -t .\assets\installer_left.webp

          if (!(Test-Path ".\dist\AkashaNavigator\AkashaNavigator.update.exe")) {
            Write-Error "AkashaNavigator.update.exe 生成失败"
            exit 1
          }

      - name: 📦 Pack 7z
        run: |
          cd dist
          7z a "AkashaNavigator_v${{ needs.validate.outputs.version }}.7z" AkashaNavigator -t7z -mx=5 -r -y

      - uses: actions/upload-artifact@v6
        with:
          name: AkashaNavigator_7z
          path: dist/AkashaNavigator_v*.7z

  build_installer:
    runs-on: windows-latest
    needs: [validate, build_dist]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: AkashaNavigator_7z
          path: dist

      - name: 📦 Unpack
        run: |
          cd dist
          Write-Host "当前目录：$(Get-Location)"
          Write-Host "Unpack 前文件列表："
          Get-ChildItem -Recurse | ForEach-Object { Write-Host $_.FullName }
          7z x "AkashaNavigator_v${{ needs.validate.outputs.version }}.7z"
          Write-Host "Unpack 后文件列表："
          Get-ChildItem -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: 📥 Download kachina-builder
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "当前目录：$(Get-Location)"
          gh release download `
            --repo YuehaiTeam/kachina-installer `
            --pattern "kachina-builder.exe" `
            --dir .

          Write-Host "下载后文件列表："
          Get-ChildItem -Recurse | Where-Object { $_.Name -like "*kachina-builder*" } | ForEach-Object { Write-Host $_.FullName }

      - name: 📥 Download previous package for diff
        id: prepare_diff
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "ColinXHL/akasha-navigator"
          $currentVersion = "${{ needs.validate.outputs.version }}"
          $currentAssetName = "AkashaNavigator_v${currentVersion}.7z"

          $releases = (gh api "repos/$repo/releases?per_page=30") | ConvertFrom-Json
          $targetAsset = $null
          $targetTag = $null

          foreach ($release in $releases) {
            if ($release.draft) {
              continue
            }

            foreach ($asset in $release.assets) {
              if ($asset.name -like "AkashaNavigator_v*.7z" -and $asset.name -ne $currentAssetName) {
                $targetAsset = $asset
                $targetTag = $release.tag_name
                break
              }
            }

            if ($null -ne $targetAsset) {
              break
            }
          }

          if ($null -eq $targetAsset) {
            Write-Host "未找到可用历史 7z 包，跳过 diff-vers"
            "diff_dir=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          New-Item -ItemType Directory -Path ".\dist\previous" -Force | Out-Null
          gh release download `
            $targetTag `
            --repo $repo `
            --pattern $targetAsset.name `
            --dir ".\dist\previous" `
            --clobber

          Push-Location ".\dist\previous"
          7z x $targetAsset.name
          Pop-Location

          if (Test-Path ".\dist\previous\AkashaNavigator") {
            "diff_dir=.\\previous\\AkashaNavigator" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "使用历史版本做差分：.\\dist\\previous\\AkashaNavigator"
          }
          else {
            Write-Host "历史包解压后未找到 AkashaNavigator 目录，跳过 diff-vers"
            "diff_dir=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: 🧰 Generate hashed directory for packing
        shell: pwsh
        run: |
          cd dist
          Write-Host "当前目录：$(Get-Location)"
          Write-Host "生成 hashed 临时目录..."

          $args = @(
            "gen",
            "-j", "4",
            "-i", "AkashaNavigator",
            "-m", "metadata.json",
            "-o", "hashed",
            "-r", "ColinXHL/akasha-navigator",
            "-t", "${{ needs.validate.outputs.version }}",
            "-u", ".\\AkashaNavigator\\AkashaNavigator.update.exe"
          )

          $diffDir = "${{ steps.prepare_diff.outputs.diff_dir }}"
          if (-not [string]::IsNullOrWhiteSpace($diffDir)) {
            Write-Host "启用差分基线目录：$diffDir"
            $args += @("--diff-vers", $diffDir)
          }
          else {
            Write-Host "未启用差分基线目录，进行全量生成"
          }

          & ..\kachina-builder.exe @args

          Write-Host "hashed 目录内容："
          Get-ChildItem hashed -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: 🧰 Pack Installer
        shell: pwsh
        run: |
          cd dist
          Write-Host "开始打包 installer..."

          ..\kachina-builder.exe pack `
            -c ..\Build\kachina.config.json `
            -m metadata.json `
            --icon ..\assets\icons\akasha-navigator.ico `
            -t ..\assets\installer_left.webp `
            -d hashed `
            -o AkashaNavigator.Install.${{ needs.validate.outputs.version }}.exe

          Write-Host "打包完成"

      - uses: actions/upload-artifact@v6
        with:
          name: AkashaNavigator_Installer
          path: dist/AkashaNavigator.Install.*.exe

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build_installer]
    permissions:
      contents: write
    if: github.event.inputs.create_release == 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: AkashaNavigator_Installer
          path: release

      - uses: actions/download-artifact@v7
        with:
          name: AkashaNavigator_7z
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: AkashaNavigator v${{ needs.validate.outputs.version }}
          draft: true
          prerelease: ${{ github.event.inputs.channel == 'dev' }}
          body_path: release_badges.md
          fail_on_unmatched_files: true
          files: |
            release/AkashaNavigator.Install.*.exe
            release/AkashaNavigator_v*.7z
