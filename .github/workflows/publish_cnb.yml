name: Publish Navigator Release to CNB
run-name: "Publish Navigator ${{ inputs.version }} to CNB"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing public GitHub Release version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "navigator-cnb-release-${{ inputs.version }}"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate public GitHub Release and download assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version: $VERSION"
            exit 1
          fi

          tag="v$VERSION"
          release_json="$(gh release view "$tag" --json isDraft,isPrerelease,assets)"
          test "$(jq -r .isDraft <<<"$release_json")" = "false"

          mkdir -p release
          for asset in "AkashaNavigator.Install.$VERSION.exe" "AkashaNavigator_v$VERSION.7z"; do
            count="$(jq --arg name "$asset" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
            test "$count" = "1"
            gh release download "$tag" --pattern "$asset" --dir release
            test -s "release/$asset"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trigger CNB public-Release mirror
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --disable-pip-version-check requests
          python .github/workflows/cnb_trigger.py "$CNB_TOKEN" \
            --event api_trigger_release \
            --version "$VERSION"

      - name: Verify CNB public readback matches GitHub assets
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          base="https://cnb.cool/AkashaNavigator/akasha-navigator/-/releases/download/$tag"
          for asset in "AkashaNavigator.Install.$VERSION.exe" "AkashaNavigator_v$VERSION.7z"; do
            curl --fail --location --retry 30 --retry-delay 10 --retry-all-errors \
              "$base/$asset" --output "readback-$asset"
            expected="$(sha256sum "release/$asset" | cut -d' ' -f1)"
            actual="$(sha256sum "readback-$asset" | cut -d' ' -f1)"
            test "$expected" = "$actual"
          done
