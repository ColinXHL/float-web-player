name: Publish Navigator Release to CNB
run-name: "Publish Navigator ${{ inputs.version }} to CNB"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing public GitHub Release version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "navigator-cnb-release-${{ inputs.version }}"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public GitHub Release and download assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version: $VERSION"
            exit 1
          fi

          tag="v$VERSION"
          release_json="$(gh release view "$tag" --json isDraft,isPrerelease,assets)"
          test "$(jq -r .isDraft <<<"$release_json")" = "false"

          installer="AkashaNavigator.Install.$VERSION.exe"
          portable="AkashaNavigator_v$VERSION.7z"
          for asset in "$installer" "$portable"; do
            count="$(jq --arg name "$asset" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
            test "$count" = "1"
          done

          mkdir -p release
          gh release download "$tag" --pattern "$installer" --pattern "$portable" --dir release
          test -s "release/$installer"
          test -s "release/$portable"

      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check -r .github/workflows/requirements.txt

      - name: Publish identical assets to CNB
        shell: python
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path(".github/workflows").resolve()))
          from cnb_release import CNBReleaseUploader

          version = os.environ["VERSION"]
          token = os.environ.get("CNB_TOKEN", "")
          if not token:
              raise RuntimeError("CNB_TOKEN is empty")

          assets = [
              Path("release") / f"AkashaNavigator.Install.{version}.exe",
              Path("release") / f"AkashaNavigator_v{version}.7z",
          ]
          for asset in assets:
              if not asset.is_file() or asset.stat().st_size == 0:
                  raise RuntimeError(f"release asset is missing: {asset}")

          prerelease = "-" in version
          uploader = CNBReleaseUploader(token=token)
          release = uploader.create_release(
              "AkashaNavigator/akasha-navigator",
              {
                  "tag_name": f"v{version}",
                  "name": f"AkashaNavigator v{version}",
                  "body": (
                      f"AkashaNavigator v{version} automated mirror. "
                      "Assets are identical to the verified GitHub Release."
                  ),
                  "draft": False,
                  "prerelease": prerelease,
                  "target_commitish": "main",
                  "make_latest": "false" if prerelease else "true",
              },
          )
          if not release or not release.get("id"):
              raise RuntimeError("CNB Release creation did not return an id")

          results = uploader.upload_multiple_assets(
              "AkashaNavigator/akasha-navigator",
              str(release["id"]),
              [str(asset) for asset in assets],
              overwrite=True,
              show_progress=False,
          )
          if not all(results):
              raise RuntimeError("one or more CNB assets failed to upload or verify")

      - name: Verify CNB public readback matches GitHub assets
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          base="https://cnb.cool/AkashaNavigator/akasha-navigator/-/releases/download/$tag"
          for asset in "AkashaNavigator.Install.$VERSION.exe" "AkashaNavigator_v$VERSION.7z"; do
            curl --fail --location --retry 6 --retry-delay 5 "$base/$asset" --output "readback-$asset"
            test "$(sha256sum "release/$asset" | cut -d' ' -f1)" = "$(sha256sum "readback-$asset" | cut -d' ' -f1)"
          done
